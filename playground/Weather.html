<!DOCTYPE html>
<html lang="cs">
<head>
  <meta charset="UTF-8">
  <title>Počasí</title>
</head>
<body>

<!-- Nadpis a instrukce -->
<h1>Aktuální počasí ve městech</h1>
<p>Do formuláře zadej názvy nejvýše tří měst (odděl čárkou nebo středníkem).</p>
<p>Po kliknutí na "Zobrazit počasí", uvidíš dnešní min a max teploty v zadaných městech.</p>
<!-- Formulář pro zadání měst -->
<form id="weather-form">
  <label for="city-input"></label><input type="text" id="city-input" placeholder="Např. Praha, Brno, Ostrava" />
  <button type="submit">Zobrazit počasí</button>
</form>

<!-- Výstup pro chyby -->
<div id="error" style="color: red; margin-top: 1em;"></div>

<!-- Výstup pro výsledky počasí -->
<div id="results" style="margin-top: 1em;"></div>

<script>
  // Funkce pro získání souřadnic města z geolokačního API
  async function getCoordinates(city) {
    const response = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(city)}&count=1&language=cs&format=json`);
    const data = await response.json();
    const result = data.results?.[0]; // první výsledek, pokud existuje

    if (!result) {
      // Pokud API nevrátí žádný výsledek, vyhoď chybu
      throw new Error(`Souřadnice pro "${city}" nebyly nalezeny.`);
    }

    // Vrátí název města + souřadnice
    return {
      name: result.name,
      latitude: result.latitude,
      longitude: result.longitude
    };
  }

  // Funkce pro získání počasí podle souřadnic
  async function getWeather({ latitude, longitude }) {
    // Sestavení URL s parametry pro API počasí
    const url = `https://api.open-meteo.com/v1/forecast?latitude=${latitude}&longitude=${longitude}&daily=temperature_2m_max,temperature_2m_min&timezone=auto`;

    const response = await fetch(url);
    const data = await response.json();

    // Kontrola, že se vrátila data o počasí
    if (!data.daily || !data.daily.temperature_2m_min || !data.daily.temperature_2m_max) {
      throw new Error("Počasí se nepodařilo načíst.");
    }

    // Vrátí minimální a maximální teplotu pro první den
    return {
      min: data.daily.temperature_2m_min[0],
      max: data.daily.temperature_2m_max[0]
    };
  }

  // Událost po odeslání formuláře
  document.getElementById('weather-form').addEventListener('submit', async function(event) {
    event.preventDefault(); // Zabrání reloadu stránky

    const input = document.getElementById('city-input').value;

    // Rozdělení vstupu na jednotlivá města (oddělená čárkou nebo středníkem)
    const mesta = input
            .split(/[,;]/) // regulární výraz: rozděl podle čárky nebo středníku
            .map(mesto => mesto.trim()) // odstraní mezery kolem každého města
            .filter(mesto => mesto !== ''); // odstraní prázdné položky (např. z vícenásobných čárek)

    // Nulování starých výstupů
    const errorDiv = document.getElementById('error');
    const resultsDiv = document.getElementById('results');
    errorDiv.textContent = '';
    resultsDiv.innerHTML = '';

    // Ošetření prázdného vstupu
    if (mesta.length === 0) {
      errorDiv.textContent = 'Zadej alespoň jedno město.';
      return;
    }

    // Ošetření maximálního počtu měst
    if (mesta.length > 3) {
      errorDiv.textContent = 'Zadej maximálně tři města.';
      return;
    }

    // Pro každé město spustí načtení souřadnic a počasí
    for (const city of mesta) {
      try {
        // Získání souřadnic
        const coords = await getCoordinates(city);

        // Získání dat o počasí podle souřadnic
        const weather = await getWeather(coords);

        // Vygenerování výstupu pro dané město
        const resultHTML = `
          <p><strong>${coords.name}</strong>:
          Min: ${weather.min}°C, Max: ${weather.max}°C</p>
        `;

        // Přidání výstupu do stránky
        resultsDiv.innerHTML += resultHTML;

      } catch (error) {
        // Chyba u jednoho města – zobrazí ji, ale pokračuje dál
        resultsDiv.innerHTML += `<p style="color: red;">${error.message}</p>`;
      }
    }
  });
</script>

</body>
</html>
