openapi: 3.0.3
info:
  title: Události API
  version: 1.0.0
  description: API pro správu událostí a hlasování o termínu.

servers:
  - url: http://localhost:4000
    description: Lokální vývojový server

tags:
  - name: events
    description: Operace nad událostmi

paths:
  /api/events:
    get:
      tags: [events]
      summary: Získat seznam všech událostí
      operationId: listEvents
      responses:
        '200':
          description: Seznam událostí v obálce `items`
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Event'
              examples:
                sample:
                  summary: Ukázkový seznam
                  value:
                    items:
                      - id: 1
                        title: Super akce
                        location: Praha
                        dates:
                          - timestamp: 1726514405258
                            records:
                              - name: Honza
                                answer: yes
                              - name: Jana
                                answer: no
                          - timestamp: 1726600861177
                            records:
                              - name: Jana
                                answer: if-needed
                      - id: 2
                        title: Super akce 2
                        location: Brno
                        dates: []
        '500':
          $ref: '#/components/
